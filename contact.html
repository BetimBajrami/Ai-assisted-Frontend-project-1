<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Here goes the header-->
    <header class="site-header">
      <div class="container">
        <!-- Company name/logo goes here. -->
        <nav class="site-nav" aria-label="Main navigation">
          <!-- Starter links: CSS-only burger menu to be added. -->
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About us</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="section" aria-labelledby="contact-heading">
        <div class="container">
          <h1 id="contact-heading">Contact</h1>
          <!-- Introductory copy goes here later. -->

          <div class="contact-layout">
            <!-- Structure only: agree on form handling before enabling submit. -->
            <form class="contact-form" aria-label="Contact form">
              <div class="form-field">
                <label for="contact-name">Name</label>
                <input
                  type="text"
                  id="contact-name"
                  name="name"
                  autocomplete="name"
                  required
                />
              </div>

              <div class="form-field">
                <label for="contact-email">Email</label>
                <input
                  type="email"
                  id="contact-email"
                  name="email"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-field">
                <label for="contact-message">Message</label>
                <textarea
                  id="contact-message"
                  name="message"
                  rows="6"
                  required
                ></textarea>
              </div>

              <button type="submit" disabled>Send message</button>
            </form>

            <div class="contact-details">
              <!-- Add agreed contact details here; use <address> for company contact information. -->
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Replace with the same agreed footer used on all pages. -->
    <footer class="site-footer">
      <div class="container footer-container">
        <!-- Footer content goes here later. -->
      </div>
    </footer>
  </body>
</html>
